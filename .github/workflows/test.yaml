name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        required: false

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: setup-beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '28'
          rebar3-version: '3.25.1'

      - run: rebar3 dialyzer
      - run: rebar3 xref

  test:
    runs-on: ubuntu-latest
    services:
      opents:
        image: petergrace/opentsdb-docker:9aa7f88
        ports:
          - 4242:4242
    steps:
      - name: wait until opents server is up
        timeout-minutes: 3
        run: |
          while ! curl http://localhost:4242 ; do
            sleep 1
          done
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: setup-beam
        uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: '28'
          rebar3-version: '3.25.1'

      - run: rebar3 eunit
      - run: rebar3 ct --readable=true
        env:
          OPENTS_SERVER: localhost:4242
